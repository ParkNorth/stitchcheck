name: CI

# Gates on pull requests and on pushes to non-default branches.
# The default branch runs the same gates inside the deploy workflow.

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:catalog
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
